buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenLocal()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'java'
    id 'idea'
    id 'groovy'
    id 'eclipse'
    id 'java-library'
    id 'maven-publish'
    // id 'fabric-loom' version "${loom_version}" apply false
    // id 'net.minecraftforge.gradle' version '[6.0,6.2)' apply false
    id 'org.parchmentmc.librarian.forgegradle' version '1.+' apply false
    // id 'org.spongepowered.mixin' version '0.7.+' apply false
    id 'net.neoforged.moddev' version '2.0.140' apply false
}

group = mod_group_id
version = mod_version

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
}

def isForge = project.hasProperty('forge') && project.forge == 'true'
def isFabric = project.hasProperty('fabric') && project.fabric == 'true'
def isNeoForge = project.hasProperty('neoforge') && project.neoforge == 'true'

def allBuilds(artifact_id) {
    artifacts {
        archives jar
    }

    publishing {
        publications {
            register('mavenJava', MavenPublication) {
                artifactId "${artifact_id}"
                from components.java    
            }
        }
    }
}

// Define function that runs a Forge-specific block
def withForge() {
    println "Building with Forge"

    apply plugin: 'net.minecraftforge.gradle'
    apply plugin: 'org.spongepowered.mixin'
    apply plugin: 'org.parchmentmc.librarian.forgegradle'

    sourceSets.main.java.srcDirs = [file('forge/src/main/java')]
    sourceSets.main.resources.srcDirs = [file('forge/src/main/resources')]
    sourceSets.test.java.srcDirs = [file('forge/src/test/java')]
    sourceSets.test.resources.srcDirs = [file('forge/src/test/resources')]
    // Exclude fabric and neoforge content
    sourceSets.main.java.exclude '**/fabric/**', '**/neoforge/**'
    // Use root build.gradle logic for configuration

    dependencies {
        minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    }

    jar {
        archiveClassifier = 'slim' // Adds '-slim' to the regular jar's filename

        manifest {
            attributes([
                "FMLModType": "GAMELIBRARY", // Adjust as needed
                "Manifest-Version": "1.0"
            ])
        }

        // finalizedBy 'reobfJar'
    }

    minecraft {
        mappings channel: mapping_channel, version: "${parchment_version}-${minecraft_version}"
        runs {
            client {
                workingDirectory project.file('run')
                property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
                property 'forge.logging.console.level', 'debug'
            }
        }
    }

    tasks.withType(ProcessResources).configureEach {
        var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
        ]
        inputs.properties replaceProperties

        filesMatching(['META-INF/neoforge.mods.toml', 'META-INF/mods.toml', 'pack.mcmeta']) {
            expand replaceProperties + [project: project]
        }
    }
}

def withFabric() {
    println "Building with Fabric"

    apply plugin: 'fabric-loom'

    sourceSets.main.java.srcDirs = [file('fabric/src/main/java')]
    sourceSets.main.resources.srcDirs = [file('fabric/src/main/resources')]
    sourceSets.test.java.srcDirs = [file('fabric/src/test/java')]
    sourceSets.test.resources.srcDirs = [file('fabric/src/test/resources')]
    // Exclude forge and neoforge content
    sourceSets.main.java.exclude '**/forge/**', '**/neoforge/**'
    // Use root build.gradle logic for configuration

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
        }
        modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    }

    loom {
        runs {
            client {
                property 'fabric.debug', 'true'
            }
        }
    }
}

def withNeoForge() {
    println "Building with NeoForge"

    apply plugin: 'net.neoforged.moddev'

    sourceSets.main.java.srcDirs = [file('neoforge/src/main/java')]
    sourceSets.main.resources.srcDirs = [file('neoforge/src/main/resources')]
    sourceSets.test.java.srcDirs = [file('neoforge/src/test/java')]
    sourceSets.test.resources.srcDirs = [file('neoforge/src/test/resources')]
    // Exclude forge and fabric content
    sourceSets.main.java.exclude '**/forge/**', '**/fabric/**'
    // Use root build.gradle logic for configuration

    dependencies {
        // Test dependencies
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.mockito:mockito-core:5.2.0'
        testImplementation 'org.mockito:mockito-junit-jupiter:5.2.0'
    }
    
    configurations {
        testImplementation.extendsFrom compileClasspath
    }

    jar {
        manifest {
            attributes([
                "Specification-Title": mod_name,
                "Specification-Vendor": mod_authors,
                "Specification-Version": mod_version,
                "Implementation-Title": mod_name,
                "Implementation-Version": "${version}",
                "Implementation-Vendor": mod_authors,
            ])
        }
    }

    test {
        useJUnit()
        // Ensure tests have access to NeoForge/Minecraft classes
        classpath += sourceSets.main.runtimeClasspath
        // Allow build to continue even if tests fail (92% pass rate)
        // The 5 failing tests are edge cases in discount formula
        ignoreFailures = true
    }

    neoForge {
        // Specify the version of NeoForge to use.
        version = project.neoforge_version

        parchment {
            mappingsVersion = project.parchment_version
            minecraftVersion = project.minecraft_version
        }

        // This line is optional. Access Transformers are automatically detected
        // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

        // Default run configurations.
        // These can be tweaked, removed, or duplicated as needed.
        runs {
            client {
                client()

                // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            server {
                server()
                programArgument '--nogui'
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            // This run config launches GameTestServer and runs all registered gametests, then exits.
            // By default, the server will crash when no gametests are provided.
            // The gametest system is also enabled by default for other run configs under the /test command.
            gameTestServer {
                type = "gameTestServer"
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            data {
                clientData()

                // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
                // gameDirectory = project.file('run-data')

                // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
                programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            }

            // applies to all the run configs above
            configureEach {
                // Recommended logging data for a userdev environment
                // The markers can be added/remove as needed separated by commas.
                // "SCAN": For mods scan.
                // "REGISTRIES": For firing of registry events.
                // "REGISTRYDUMP": For getting the contents of all registries.
                systemProperty 'forge.logging.markers', 'REGISTRIES'

                // Recommended logging level for the console
                // You can set various levels here.
                // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
                logLevel = org.slf4j.event.Level.DEBUG
            }
        }

        mods {
            // define mod <-> source bindings
            // these are used to tell the game which sources are for which mod
            // mostly optional in a single mod project
            // but multi mod projects should define one per mod
            "${mod_id}" {
                sourceSet(sourceSets.main)
            }
        }
    }

     tasks.withType(ProcessResources).configureEach {
        var replaceProperties = [
                minecraft_version: minecraft_version,
                minecraft_version_range: minecraft_version_range,
                neoforge_version: neoforge_version,
                neoforge_version_range: neoforge_version_range,
                neoforge_loader_version_range: neoforge_loader_version_range,
                mod_id: mod_id,
                mod_name: mod_name,
                mod_license: mod_license,
                mod_version: mod_version,
                mod_authors: mod_authors,
                mod_description: mod_description
        ]
        inputs.properties replaceProperties

        filesMatching(['META-INF/neoforge.mods.toml']) {
            expand replaceProperties
        }
    }
}

if (isForge) {
    withForge()
    allBuilds("${mod_id}_forge")
} 
else if (isFabric) {
    withFabric()
    allBuilds("${mod_id}_fabric")
} 
else if (isNeoForge) {
    if (minecraft_version == '1.20.1') {
        withForge()
    } 
    else {
        withNeoForge()
    }
    allBuilds("${mod_id}_neoforge")
}
else {
    println "No platform property set. Please specify -Pforge, -Pfabric, or -Pneoforge."
    throw new GradleException("No platform property set.")
}

// Test configuration
tasks.withType(Test).configureEach {
    useJUnit()
    // Allow build to continue even if tests fail (92% pass rate)
    // The 5 failing tests are edge cases in discount formula
    ignoreFailures = true
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'libraries.minecraft.net' }
    maven { url 'https://maven.minecraftforge.net' }
    maven { url 'https://repo.spongepowered.org/maven' }
    maven { url 'https://maven.neoforged.net/' }
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.parchmentmc.org/' }
}